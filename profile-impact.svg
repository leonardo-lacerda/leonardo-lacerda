<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Gráfico de contribuições de Leonardo Lacerda no GitHub</title>
  <desc id="desc">1.248 contribuições no último ano, sendo 99 por cento commits e 1 por cento pull requests.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080D1B"/>
      <stop offset="0.55" stop-color="#111A35"/>
      <stop offset="1" stop-color="#1D1235"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.52" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#D946EF"/>
    </linearGradient>
    <linearGradient id="commitBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="prBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D946EF"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="560" rx="30" fill="url(#bg)"/>
  <circle cx="1080" cy="45" r="170" fill="#7C3AED" opacity="0.16" filter="url(#glow)"/>
  <circle cx="980" cy="520" r="150" fill="#06B6D4" opacity="0.10" filter="url(#glow)"/>

  <text x="72" y="56" fill="#67E8F9" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.4">GITHUB ACTIVITY • ÚLTIMOS 12 MESES</text>
  <text x="72" y="112" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="750">Ritmo de entrega</text>
  <text x="72" y="147" fill="#AAB7D6" font-family="Segoe UI, Arial, sans-serif" font-size="18">Contribuições que mostram consistência, execução e evolução.</text>
  <line x1="72" y1="180" x2="1128" y2="180" stroke="#2A3658" stroke-width="1"/>

  <g filter="url(#shadow)">
    <rect x="72" y="214" width="410" height="260" rx="22" fill="#0D152A" stroke="#293A63"/>
    <rect x="72" y="214" width="410" height="6" rx="3" fill="url(#accent)"/>
    <text x="104" y="263" fill="#8FA3C9" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">TOTAL DE CONTRIBUIÇÕES</text>
    <text x="101" y="357" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="102" font-weight="800">1.248</text>
    <text x="106" y="399" fill="#C7D2FE" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">contribuições no último ano</text>
    <circle cx="425" cy="270" r="25" fill="#13264B" stroke="#22D3EE" stroke-width="2"/>
    <path d="M414 270h22M425 259v22" stroke="#67E8F9" stroke-width="3" stroke-linecap="round"/>
    <text x="106" y="445" fill="#64749A" font-family="Segoe UI, Arial, sans-serif" font-size="14">Um histórico público de construção contínua.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="516" y="214" width="612" height="260" rx="22" fill="#0D152A" stroke="#293A63"/>
    <text x="550" y="263" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Como esse ritmo acontece?</text>
    <text x="550" y="291" fill="#8FA3C9" font-family="Segoe UI, Arial, sans-serif" font-size="15">A maior parte da atividade está concentrada em entrega de código.</text>

    <circle cx="665" cy="375" r="72" fill="none" stroke="#263653" stroke-width="22"/>
    <circle cx="665" cy="375" r="72" fill="none" stroke="url(#commitBar)" stroke-width="22" stroke-linecap="round" stroke-dasharray="448 5" transform="rotate(-90 665 375)"/>
    <circle cx="665" cy="375" r="72" fill="none" stroke="url(#prBar)" stroke-width="22" stroke-linecap="round" stroke-dasharray="5 448" stroke-dashoffset="-448" transform="rotate(-90 665 375)"/>
    <text x="665" y="371" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800">99%</text>
    <text x="665" y="397" text-anchor="middle" fill="#8FA3C9" font-family="Segoe UI, Arial, sans-serif" font-size="13">commits</text>

    <text x="785" y="348" fill="#67E8F9" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="800">99%</text>
    <text x="885" y="348" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Commits</text>
    <text x="785" y="377" fill="#D946EF" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="800">1%</text>
    <text x="840" y="377" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Pull requests</text>
    <rect x="785" y="407" width="280" height="12" rx="6" fill="#263653"/>
    <rect x="785" y="407" width="277" height="12" rx="6" fill="url(#commitBar)"/>
    <rect x="1062" y="407" width="3" height="12" rx="1.5" fill="url(#prBar)"/>
    <text x="785" y="447" fill="#64749A" font-family="Segoe UI, Arial, sans-serif" font-size="14">Foco claro em colocar soluções para funcionar.</text>
  </g>

  <g>
    <rect x="72" y="504" width="1056" height="2" fill="#2A3658"/>
    <text x="72" y="536" fill="#7183A8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">REVOPS / CRM / GROWTH OPERATIONS</text>
    <text x="1128" y="536" text-anchor="end" fill="#7183A8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">LEONARDO LACERDA</text>
  </g>
</svg>
