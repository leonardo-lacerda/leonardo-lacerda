<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Do código ao resultado</title>
  <desc id="desc">Uma visão simples de como Leonardo conecta ideias, processos, automação e impacto.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#15102B"/>
    </linearGradient>
    <linearGradient id="bluePurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="purplePink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="pinkOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DB2777"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="orangeGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="60" r="150" fill="#7C3AED" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1020" cy="380" r="120" fill="#2563EB" opacity="0.10" filter="url(#glow)"/>

  <text x="72" y="58" fill="#A78BFA" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.5">GITHUB • OPERAÇÕES &amp; AUTOMAÇÃO</text>
  <text x="72" y="110" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="750">Do código ao resultado</text>
  <text x="72" y="145" fill="#B8C1D9" font-family="Segoe UI, Arial, sans-serif" font-size="18">Projetos que conectam processos, dados e tecnologia.</text>
  <text x="72" y="186" fill="#7C3AED" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">MINHA FORMA DE CRIAR VALOR</text>
  <line x1="72" y1="205" x2="1128" y2="205" stroke="#2A3150" stroke-width="1"/>

  <g filter="url(#shadow)">
    <rect x="72" y="235" width="238" height="118" rx="18" fill="#11182B" stroke="#293556"/>
    <rect x="72" y="235" width="238" height="5" rx="2.5" fill="url(#bluePurple)"/>
    <circle cx="101" cy="271" r="18" fill="#2563EB"/>
    <text x="101" y="276" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">01</text>
    <text x="96" y="311" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">IDEIA</text>
    <text x="96" y="334" fill="#AAB5D1" font-family="Segoe UI, Arial, sans-serif" font-size="13">Entendo o problema</text>

    <rect x="342" y="235" width="238" height="118" rx="18" fill="#11182B" stroke="#293556"/>
    <rect x="342" y="235" width="238" height="5" rx="2.5" fill="url(#purplePink)"/>
    <circle cx="371" cy="271" r="18" fill="#7C3AED"/>
    <text x="371" y="276" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">02</text>
    <text x="366" y="311" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">PROCESSO</text>
    <text x="366" y="334" fill="#AAB5D1" font-family="Segoe UI, Arial, sans-serif" font-size="13">Organizo o fluxo</text>

    <rect x="612" y="235" width="238" height="118" rx="18" fill="#11182B" stroke="#293556"/>
    <rect x="612" y="235" width="238" height="5" rx="2.5" fill="url(#pinkOrange)"/>
    <circle cx="641" cy="271" r="18" fill="#DB2777"/>
    <text x="641" y="276" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">03</text>
    <text x="636" y="311" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">AUTOMAÇÃO</text>
    <text x="636" y="334" fill="#AAB5D1" font-family="Segoe UI, Arial, sans-serif" font-size="13">Conecto as ferramentas</text>

    <rect x="882" y="235" width="238" height="118" rx="18" fill="#11182B" stroke="#293556"/>
    <rect x="882" y="235" width="238" height="5" rx="2.5" fill="url(#orangeGreen)"/>
    <circle cx="911" cy="271" r="18" fill="#F97316"/>
    <text x="911" y="276" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">04</text>
    <text x="906" y="311" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">IMPACTO</text>
    <text x="906" y="334" fill="#AAB5D1" font-family="Segoe UI, Arial, sans-serif" font-size="13">Entrego uma operação melhor</text>
  </g>

  <text x="72" y="392" fill="#7180A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">REVOPS   /   CRM   /   GROWTH OPERATIONS</text>
  <text x="1128" y="392" text-anchor="end" fill="#7180A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">LEONARDO LACERDA</text>
</svg>
